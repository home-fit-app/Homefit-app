<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HomeFit AI - Entrena en Casa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #f0fdf4; min-height: 100vh; font-family: 'Inter', sans-serif; }

.hero-bg { background: linear-gradient(135deg, #16a34a 0%, #15803d 50%, #166534 100%); }

/* Cards base */
.card { background: white; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.07); }

/* Pill buttons (edad, tiempo, días) */
.pill-btn {
  border: 2px solid #e2e8f0; background: white; border-radius: 50px;
  padding: 10px 20px; cursor: pointer; font-size: 14px; font-weight: 600;
  transition: all 0.18s ease; font-family: 'Inter', sans-serif; color: #4b5563;
}
.pill-btn:hover { border-color: #16a34a44; color: #16a34a; background: #f0fdf4; }
.pill-btn.active { border-color: #16a34a; background: #f0fdf4; color: #16a34a; }

/* Option cards (nivel, objetivo) */
.opt-card {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px; border-radius: 14px;
  border: 2px solid #e5e7eb; background: white;
  cursor: pointer; transition: all 0.18s ease;
  text-align: left; width: 100%; font-family: 'Inter', sans-serif;
  color: #4b5563;
}
.opt-card:hover { border-color: #16a34a44; background: #f9fefe; transform: translateY(-1px); }
.opt-card.active { border-color: #16a34a; background: #f0fdf4; color: #15803d; }
.opt-card .oc-icon {
  width: 40px; height: 40px; border-radius: 10px; background: #f1f5f9;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0; transition: background 0.18s;
}
.opt-card.active .oc-icon { background: #dcfce7; }
.opt-card .oc-title { font-size: 14px; font-weight: 700; line-height: 1.2; color: #1f2937; }
.opt-card .oc-sub   { font-size: 12px; color: #9ca3af; margin-top: 2px; line-height: 1.2; }
.opt-card.active .oc-title { color: #15803d; }
.opt-card .oc-check {
  margin-left: auto; width: 22px; height: 22px; border-radius: 50%;
  background: #16a34a; display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: white; flex-shrink: 0;
}

/* Primary button */
.btn-primary {
  background: linear-gradient(135deg, #16a34a, #22c55e); color: white; border: none;
  border-radius: 14px; padding: 17px 32px; font-size: 16px; font-weight: 800;
  cursor: pointer; width: 100%; font-family: 'Inter', sans-serif;
  box-shadow: 0 4px 15px rgba(22,163,74,0.35); transition: all 0.2s ease;
}
.btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(22,163,74,0.45); }
.btn-primary:disabled { background: #e5e7eb; color: #9ca3af; box-shadow: none; cursor: not-allowed; transform: none; }

/* Section label */
.sec-label {
  display: block; font-weight: 700; color: #374151;
  margin-bottom: 12px; font-size: 14px;
}

/* Progress bar */
.prog-bar {
  height: 5px; background: #e5e7eb; border-radius: 3px; margin-bottom: 28px;
}
.prog-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, #16a34a, #22c55e);
  transition: width 0.4s ease;
}

/* Input */
.hf-input {
  width: 100%; padding: 14px 18px; border-radius: 12px; border: 2px solid #e5e7eb;
  font-size: 15px; font-family: 'Inter', sans-serif; outline: none;
  transition: border-color 0.2s; color: #1f2937; background: white;
}
.hf-input:focus { border-color: #16a34a66; }
.hf-input::placeholder { color: #9ca3af; }

/* Loading dots */
@keyframes loadBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-12px); opacity: 1; }
}
.load-dot { animation: loadBounce 1.4s infinite ease-in-out; }
.load-dot:nth-child(1) { animation-delay: 0s; }
.load-dot:nth-child(2) { animation-delay: 0.18s; }
.load-dot:nth-child(3) { animation-delay: 0.36s; }

/* Day card */
.day-card { border-radius: 16px; border: 2px solid #e5e7eb; overflow: hidden; margin-bottom: 10px; }
.day-head { padding: 13px 18px; background: #f8fafc; display: flex; align-items: center; gap: 12px; }
.day-num  {
  width: 28px; height: 28px; border-radius: 8px;
  background: #dcfce7; border: 1px solid #86efac;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800; color: #16a34a; flex-shrink: 0;
}
.day-title { font-size: 14px; font-weight: 700; color: #1f2937; }
.day-body  { padding: 16px 18px; color: #4b5563; font-size: 14px; line-height: 1.9; white-space: pre-wrap; border-top: 1px solid #f1f5f9; }

/* Badge */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 12px; border-radius: 100px; font-size: 12px; font-weight: 600;
  background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d;
}

/* Fade in */
@keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.4s ease forwards; }

/* Exercise card action buttons */
.ej-btn {
  flex: 1; padding: 8px 6px; border-radius: 9px; font-size: 12px;
  font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer;
  transition: all 0.18s ease; text-align: center; text-decoration: none;
  display: flex; align-items: center; justify-content: center; gap: 4px;
}
.ej-btn-steps {
  border: 1.5px solid #16a34a55; background: white; color: #16a34a;
}
.ej-btn-steps.open { background: #f0fdf4; }
.ej-btn-steps:hover { background: #f0fdf4; border-color: #16a34a; }
.ej-btn-video {
  border: 1.5px solid #ef444455; background: white; color: #ef4444;
}
.ej-btn-video:hover { background: #fff5f5; border-color: #ef4444; }

/* Steps list */
.steps-list {
  margin: 12px 0 0; padding: 12px 14px;
  background: #f0fdf4; border-radius: 10px;
  border: 1px solid #dcfce7;
  list-style: none;
}
.steps-list li {
  display: flex; gap: 10px; font-size: 12px; color: #374151;
  line-height: 1.6; padding: 4px 0;
  border-bottom: 1px solid #dcfce7;
}
.steps-list li:last-child { border-bottom: none; }
.steps-list li .step-num {
  width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
  background: #16a34a; color: white; font-size: 11px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; margin-top: 1px;
}

/* Logo pulse */
@keyframes logoPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.3); }
  50%  { box-shadow: 0 0 0 8px rgba(255,255,255,0); }
}
</style>
</head>
<body>
<div id="root"></div>

// ─── Pill button ──────────────────────────────────────────────────────────
function Pill({ label, selected, onClick }) {
  return (
    <button className={`pill-btn${selected ? " active" : ""}`} onClick={onClick}>
      {label}
    </button>
  );
}

// ─── Option card ──────────────────────────────────────────────────────────
function OptionCard({ icon, val, sub, selected, onClick }) {
  return (
    <button className={`opt-card${selected ? " active" : ""}`} onClick={onClick}>
      <div className="oc-icon">{icon}</div>
      <div style={{ flex: 1 }}>
        <div className="oc-title">{val}</div>
        {sub && <div className="oc-sub">{sub}</div>}
      </div>
      {selected && <div className="oc-check">✓</div>}
    </button>
  );
}

// ─── Form screen ─────────────────────────────────────────────────────────
function PerfilForm({ onGenerar }) {
  const [form, setForm] = useState({ nombre: "", edad: "", nivel: "", objetivo: "", tiempo: "", dias: "" });

          <div style={{ width: "38px", height: "38px", borderRadius: "10px", background: "rgba(255,255,255,0.2)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "20px" }}>
            🏠
          </div>
          <span style={{ fontSize: "20px", fontWeight: "800", letterSpacing: "-0.5px" }}>HomeFit</span>
        </div>
        <img
          src={heroImg}
          alt="Entrenamiento en casa"
          style={{ width: "100%", maxWidth: "460px", borderRadius: "20px", marginBottom: "24px", boxShadow: "0 20px 60px rgba(0,0,0,0.3)", objectFit: "cover", maxHeight: "260px" }}
        />
        <h1 style={{ fontSize: "clamp(26px,6vw,42px)", fontWeight: "900", marginBottom: "10px", lineHeight: 1.1 }}>
          Entrena en casa 🏠
        </h1>

        </p>
      </div>

      {/* Form card */}
      <div style={{ maxWidth: "580px", margin: "-40px auto 0", padding: "0 20px 60px", position: "relative" }}>
        <div className="card fade-in" style={{ padding: "32px" }}>
          {/* Title + counter */}
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "8px" }}>
            <h2 style={{ fontSize: "20px", fontWeight: "800", color: "#1f2937" }}>✨ Crea tu plan gratis</h2>
            <span style={{ fontSize: "13px", fontWeight: "700", color: filled === 5 ? "#16a34a" : "#9ca3af" }}>{filled}/5</span>
          </div>
          {/* Progress bar */}
          <div className="prog-bar">
            <div className="prog-fill" style={{ width: `${filled * 20}%` }} />
          </div>

          <div style={{ display: "flex", flexDirection: "column", gap: "24px" }}>
            {/* Nombre */}
            <div>
              <label className="sec-label">👤 Tu nombre <span style={{ fontWeight: 400, color: "#9ca3af" }}>(opcional)</span></label>
              <input
                className="hf-input"
                value={form.nombre}
                onChange={e => setForm(f => ({ ...f, nombre: e.target.value }))}
                placeholder="¿Cómo te llamamos?"
              />
            </div>

            {/* Edad */}
            <div>
              <label className="sec-label">🎂 Tu rango de edad</label>
              <div style={{ display: "flex", flexWrap: "wrap", gap: "8px" }}>
                {EDADES.map(e => <Pill key={e} label={e} selected={form.edad === e} onClick={() => toggle("edad", e)} />)}
              </div>
            </div>

            {/* Nivel */}
            <div>
              <label className="sec-label">🌱 Nivel de condición física</label>
              <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                {NIVELES.map(o => (
                  <OptionCard key={o.val} {...o} selected={form.nivel === o.val} onClick={() => toggle("nivel", o.val)} />
                ))}
              </div>
            </div>

            {/* Objetivo */}
            <div>
              <label className="sec-label">🎯 Tu objetivo principal</label>
              <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                {OBJETIVOS.map(o => (
                  <OptionCard key={o.val} {...o} selected={form.objetivo === o.val} onClick={() => toggle("objetivo", o.val)} />
                ))}
              </div>
            </div>

            {/* Tiempo */}
            <div>
              <label className="sec-label">⏱️ Tiempo por sesión</label>
              <div style={{ display: "flex", flexWrap: "wrap", gap: "8px" }}>
                {TIEMPOS.map(val => <Pill key={val} label={val} selected={form.tiempo === val} onClick={() => toggle("tiempo", val)} />)}

            </div>

            {/* Días */}

            </button>

        </div>

        {/* Features strip */}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "12px", marginTop: "20px" }}>
          {[
            { emoji: "🤖", titulo: "IA Personalizada", desc: "Adaptado a tu edad" },
            { emoji: "🏠", titulo: "Sin equipo",       desc: "Solo tu cuerpo" },
            { emoji: "👴👩", titulo: "Para todos",    desc: "De 15 a 71+ años" },
          ].map(f => (
            <div key={f.titulo} className="card" style={{ padding: "16px", textAlign: "center" }}>
              <div style={{ fontSize: "28px", marginBottom: "8px" }}>{f.emoji}</div>
              <div style={{ fontWeight: "700", fontSize: "13px", color: "#1f2937", marginBottom: "4px" }}>{f.titulo}</div>
              <div style={{ fontSize: "12px", color: "#6b7280" }}>{f.desc}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── Loading screen ───────────────────────────────────────────────────────
function Generando() {
  const [msgIdx, setMsgIdx] = useState(0);
  useEffect(() => {
    const t = setInterval(() => setMsgIdx(i => (i + 1) % LOADING_MSGS.length), 2200);
    return () => clearInterval(t);
  }, []);

  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: "40px", background: "#f0fdf4", padding: "20px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
        <div style={{ width: "38px", height: "38px", borderRadius: "10px", background: "linear-gradient(135deg,#16a34a,#22c55e)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "20px" }}>🏠</div>
        <span style={{ fontSize: "20px", fontWeight: "800", color: "#15803d", letterSpacing: "-0.5px" }}>HomeFit</span>
      </div>
      <img src={heroImg} style={{ width: "180px", height: "180px", borderRadius: "50%", objectFit: "cover", boxShadow: "0 8px 32px rgba(22,163,74,0.25)" }} />
      <div style={{ textAlign: "center" }}>
        <div style={{ display: "flex", gap: "10px", justifyContent: "center", marginBottom: "24px" }}>
          {[0, 1, 2].map(i => (
            <div key={i} className="load-dot" style={{
              width: "12px", height: "12px", borderRadius: "50%",
              background: ["#22c55e", "#16a34a", "#15803d"][i],
            }} />
          ))}
        </div>
        <p style={{ fontSize: "17px", fontWeight: "700", color: "#16a34a", marginBottom: "6px" }}>
          {LOADING_MSGS[msgIdx]}
        </p>
        <p style={{ color: "#9ca3af", fontSize: "14px" }}>Tu entrenador IA está trabajando 💪</p>
      </div>
    </div>
  );
}

// ─── Plan day parser ──────────────────────────────────────────────────────
function parseDays(text) {
  const re = /(?:^|\n)(?:#{1,3}\s*)?(?:\*{1,2})?(?:D[ÍI]A\s*\d+|LUNES|MARTES|MI[ÉE]RCOLES|JUEVES|VIERNES|S[ÁA]BADO|DOMINGO|DAY\s*\d+)(?:[:\s\-–—].*)?(?:\*{1,2})?/gim;
  const matches = [...text.matchAll(re)];
  if (matches.length < 2) return null;
  return matches.map((m, i) => {
    const start = m.index;
    const end   = i + 1 < matches.length ? matches[i + 1].index : text.length;
    const chunk = text.slice(start, end).trim();
    const lines = chunk.split("\n");
    return { header: lines[0].replace(/[#*_]/g, "").trim(), body: lines.slice(1).join("\n").trim() };
  });
}

          </p>

          <p style={{ color: "#9ca3af", fontSize: "12px", marginTop: "12px" }}>✓ Cancela cuando quieras &nbsp;·&nbsp; ✓ Sin compromisos &nbsp;·&nbsp; ✓ Para todas las edades</p>
        </div>

        <button onClick={onReset} style={{ width: "100%", padding: "14px", background: "white", border: "2px solid #e5e7eb", borderRadius: "14px", color: "#6b7280", cursor: "pointer", fontSize: "15px", fontWeight: "600", fontFamily: "Inter,sans-serif", transition: "all 0.2s" }}>

// ─── App ──────────────────────────────────────────────────────────────────
function App() {
  const [step,   setStep]   = useState("perfil");
  const [perfil, setPerfil] = useState(null);
  const [plan,   setPlan]   = useState("");

  const handleGenerar = (form) => {
    setPerfil(form);
    setStep("generando");
    const prompt = `Eres un entrenador personal amigable y motivador. Crea un plan de entrenamiento semanal en casa para: Edad: ${form.edad}, Nivel: ${form.nivel}, Objetivo: ${form.objetivo}, Tiempo por sesión: ${form.tiempo}, Días: ${form.dias}. REGLAS: 1) Adapta la intensidad según la edad — para mayores de 55 usa ejercicios de bajo impacto. 2) Usa SOLO estos ejercicios básicos: Sentadillas, Flexiones, Plancha, Abdominales, Saltos de tijera, Zancadas, Elevación de talones, Puente de glúteos. Para mayores de 55 reemplaza saltos por caminata en el sitio. 3) Organiza por días de la semana con formato: DÍA 1 - [nombre del día]: [tipo]. 4) Indica series y repeticiones claramente. 5) Usa emojis para motivar. 6) Al final una frase motivacional. 7) Lenguaje simple y amigable.`;
    fetch("/api/claude", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: [{ role: "user", content: prompt }] }),
    })
      .then(r => r.json())
      .then(d => { setPlan(d.content?.[0]?.text || "Error generando el plan."); setStep("plan"); })
      .catch(e => { setPlan("Error de conexión: " + e.message); setStep("plan"); });
  };

  if (step === "generando") return <Generando />;
  if (step === "plan")      return <PlanView plan={plan} perfil={perfil} onReset={() => setStep("perfil")} />;
  return <PerfilForm onGenerar={handleGenerar} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
