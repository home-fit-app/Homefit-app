<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HomeFit AI</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060e06;min-height:100vh;font-family:sans-serif;color:#e8f5e8}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const React_useState = React.useState;
const niveles = ["Principiante absoluto", "Algo de base", "Intermedio"];
const objetivos = ["Perder peso", "Ganar musculo", "Mejorar resistencia", "Mas energia"];
const tiempos = ["15 min", "30 min", "45 min", "60 min"];
const diasOpc = ["2 dias", "3 dias", "4 dias", "5 dias"];

function Tag(props) {
  var label = props.label;
  var selected = props.selected;
  var onClick = props.onClick;
  var bg = selected ? "rgba(34,197,94,0.1)" : "transparent";
  var border = selected ? "1.5px solid #22c55e" : "1.5px solid #2a3a2a";
  var color = selected ? "#22c55e" : "#6b7f6b";
  return React.createElement("button", {
    onClick: onClick,
    style: {padding:"10px 18px",borderRadius:"100px",border:border,background:bg,color:color,cursor:"pointer",fontSize:"14px",margin:"4px",fontFamily:"sans-serif"}
  }, label);
}

function App() {
  var state1 = React_useState("perfil");
  var step = state1[0]; var setStep = state1[1];
  var state2 = React_useState({nivel:"",objetivo:"",tiempo:"",dias:"",nombre:""});
  var form = state2[0]; var setForm = state2[1];
  var state3 = React_useState("");
  var plan = state3[0]; var setPlan = state3[1];
  var completo = form.nivel && form.objetivo && form.tiempo && form.dias;

  function toggle(key, val) {
    var newForm = Object.assign({}, form);
    newForm[key] = form[key] === val ? "" : val;
    setForm(newForm);
  }

  function generar() {
    setStep("generando");
    fetch("/.netlify/functions/claude", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        messages: [{
          role: "user",
          content: "Eres entrenador personal. Crea plan semanal en casa sin equipo para: Nivel: " + form.nivel + ", Objetivo: " + form.objetivo + ", Tiempo: " + form.tiempo + ", Dias: " + form.dias + ". Organiza por dias con ejercicios, series y repeticiones."
        }]
      })
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      setPlan(data.content && data.content[0] ? data.content[0].text : "Error generando plan.");
      setStep("plan");
    })
    .catch(function() {
      setPlan("Error de conexion.");
      setStep("plan");
    });
  }

  if (step === "generando") {
    return React.createElement("div", {style:{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"20px"}},
      React.createElement("div", {style:{width:"60px",height:"60px",borderRadius:"50%",border:"2px solid #22c55e",borderTopColor:"transparent",animation:"spin 0.8s linear infinite"}}),
      React.createElement("style", null, "@keyframes spin{to{transform:rotate(360deg)}}"),
      React.createElement("p", {style:{color:"#22c55e",fontFamily:"monospace"}}, "Generando tu plan...")
    );
  }

  if (step === "plan") {
    return React.createElement("div", {style:{maxWidth:"600px",margin:"0 auto",padding:"40px 20px"}},
      React.createElement("h2", {style:{fontSize:"24px",marginBottom:"8px"}}, form.nombre ? "Plan de " + form.nombre : "Tu plan personalizado"),
      React.createElement("p", {style:{color:"#6b7f6b",marginBottom:"24px"}}, form.objetivo + " - " + form.tiempo + " - " + form.dias),
      React.createElement("div", {style:{background:"#0e1a0e",border:"1px solid #2a3a2a",borderRadius:"16px",padding:"24px",color:"#c8e6c8",fontSize:"14px",lineHeight:"1.8",whiteSpace:"pre-wrap",marginBottom:"24px"}}, plan),
      React.createElement("div", {style:{background:"rgba(34,197,94,0.08)",border:"1px solid rgba(34,197,94,0.2)",borderRadius:"16px",padding:"24px",textAlign:"center",marginBottom:"16px"}},
        React.createElement("h3", {style:{marginBottom:"8px"}}, "Plan de prueba gratis"),
        React.createElement("p", {style:{color:"#6b7f6b",fontSize:"13px",marginBottom:"16px"}}, "Suscribete para nuevos planes cada semana"),
        React.createElement("button", {style:{background:"linear-gradient(135deg,#16a34a,#22c55e)",color:"#fff",border:"none",borderRadius:"10px",padding:"14px 32px",fontSize:"15px",fontWeight:"600",cursor:"pointer",width:"100%"}}, "Suscribirme por $9/mes")
      ),
      React.createElement("button", {onClick:function(){setStep("perfil");},style:{width:"100%",padding:"14px",background:"transparent",border:"1px solid #2a3a2a",borderRadius:"10px",color:"#3a5a3a",cursor:"pointer",fontSize:"14px"}}, "Crear otro plan")
    );
  }

  var campos = [
    {key:"nivel",label:"Nivel de condicion fisica",opts:niveles},
    {key:"objetivo",label:"Cual es tu objetivo?",opts:objetivos},
    {key:"tiempo",label:"Tiempo por sesion",opts:tiempos},
    {key:"dias",label:"Dias a la semana",opts:diasOpc}
  ];

  return React.createElement("div", {style:{maxWidth:"560px",margin:"0 auto",padding:"40px 20px"}},
    React.createElement("div", {style:{textAlign:"center",marginBottom:"40px"}},
      React.createElement("h1", {style:{fontSize:"36px",marginBottom:"12px"}},
        "Tu plan de entreno, ",
        React.createElement("span", {style:{color:"#22c55e"}}, "sin salir de casa")
      ),
      React.createElement("p", {style:{color:"#6b7f6b"}}, "Responde 4 preguntas y la IA crea tu plan")
    ),
    React.createElement("div", {style:{display:"flex",flexDirection:"column",gap:"28px"}},
      React.createElement("div", null,
        React.createElement("label", {style:{display:"block",color:"#a0b8a0",fontSize:"12px",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"12px"}}, "Como te llamas? (opcional)"),
        React.createElement("input", {value:form.nombre,onChange:function(e){setForm(Object.assign({},form,{nombre:e.target.value}));},placeholder:"Tu nombre...",style:{width:"100%",padding:"14px 18px",borderRadius:"12px",border:"1.5px solid #2a3a2a",background:"#0e1a0e",color:"#e8f5e8",fontSize:"15px",outline:"none"}})
      ),
      campos.map(function(campo) {
        return React.createElement("div", {key:campo.key},
          React.createElement("label", {style:{display:"block",color:"#a0b8a0",fontSize:"12px",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"12px"}}, campo.label),
          React.createElement("div", {style:{display:"flex",flexWrap:"wrap"}},
            campo.opts.map(function(o) {
              return React.createElement(Tag, {key:o,label:o,selected:form[campo.key]===o,onClick:function(){toggle(campo.key,o);}});
            })
          )
        );
      }),
      React.createElement("button", {onClick:function(){if(completo)generar();},style:{width:"100%",padding:"18px",borderRadius:"14px",border:"none",background:completo?"linear-gradient(135deg,#16a34a,#22c55e)":"#1a2a1a",color:completo?"#fff":"#3a4f3a",fontSize:"16px",fontWeight:"600",cursor:completo?"pointer":"not-allowed"}},
        completo ? "Generar mi plan con IA" : "Completa las opciones para continuar"
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
