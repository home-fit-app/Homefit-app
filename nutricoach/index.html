<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>NutriCoach AI 🥗</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html{font-size:18px}
    body{font-family:'Inter',sans-serif;background:#F0FBF5;min-height:100vh;color:#2D3436}
    :root{
      --green:#1AB87C;--green-dk:#0D9E67;--green-lt:#E8FFF4;
      --yellow:#FDCB6E;--red:#FF7675;--blue:#74B9FF;
      --text:#2D3436;--muted:#636E72;--border:#DFE6E9;
      --white:#fff;--shadow:0 4px 20px rgba(0,0,0,0.08)
    }
    .app{max-width:430px;margin:0 auto;min-height:100vh;background:#F0FBF5;position:relative}
    .content{padding-bottom:84px}
    .hdr{background:linear-gradient(135deg,#1AB87C,#0D9E67);color:#fff;padding:18px 20px 22px;position:sticky;top:0;z-index:100}
    .hdr-row{display:flex;align-items:center;justify-content:space-between}
    .hdr-logo{font-size:1.3rem;font-weight:800}
    .hdr-trial{background:rgba(255,255,255,0.22);padding:4px 12px;border-radius:100px;font-size:0.75rem;font-weight:600}
    .bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--border);display:flex;z-index:100}
    .bni{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px;cursor:pointer;border:none;background:transparent;color:var(--muted);gap:2px;font-size:0.68rem;font-family:'Inter',sans-serif}
    .bni.on{color:var(--green)}
    .bni-ic{font-size:1.5rem}
    .card{background:#fff;border-radius:16px;padding:20px;margin:12px 16px;box-shadow:var(--shadow)}
    .card-title{font-size:1.05rem;font-weight:700;margin-bottom:14px;color:var(--text)}
    .btn{width:100%;padding:16px;border-radius:12px;border:none;font-size:1rem;font-weight:600;cursor:pointer;transition:transform 0.1s,opacity 0.1s;font-family:'Inter',sans-serif}
    .btn:active{transform:scale(0.98)}
    .btn-p{background:linear-gradient(135deg,#1AB87C,#0D9E67);color:#fff}
    .btn-s{background:var(--green-lt);color:var(--green-dk)}
    .btn-o{background:transparent;border:2px solid var(--green);color:var(--green)}
    .btn-sm{width:auto;padding:10px 20px;font-size:0.9rem}
    .fg{margin-bottom:16px}
    .fl{display:block;font-size:0.88rem;font-weight:600;margin-bottom:6px}
    .fi,.fs,.fta{width:100%;padding:14px;border:2px solid var(--border);border-radius:10px;font-size:1rem;font-family:'Inter',sans-serif;outline:none;transition:border-color 0.2s;background:#fff}
    .fi:focus,.fs:focus,.fta:focus{border-color:var(--green)}
    .fta{resize:none;height:80px}
    .radio-group{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .radio-opt{padding:12px;border:2px solid var(--border);border-radius:10px;cursor:pointer;text-align:center;font-size:0.9rem;font-weight:500;transition:all 0.2s}
    .radio-opt.sel{border-color:var(--green);background:var(--green-lt);color:var(--green-dk);font-weight:700}
    .ring-wrap{display:flex;justify-content:center;align-items:center;position:relative;padding:16px 0}
    .ring-inner{position:absolute;text-align:center}
    .ring-cal{font-size:1.7rem;font-weight:800;line-height:1}
    .ring-lbl{font-size:0.75rem;color:var(--muted);margin-top:2px}
    .mb{margin-bottom:10px}
    .mb-hd{display:flex;justify-content:space-between;font-size:0.82rem;margin-bottom:4px}
    .mb-hd span:first-child{font-weight:600}
    .mb-hd span:last-child{color:var(--muted)}
    .mb-track{height:10px;background:var(--border);border-radius:10px;overflow:hidden}
    .mb-fill{height:100%;border-radius:10px;transition:width 0.6s ease}
    .meal-row{display:flex;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
    .meal-row:last-child{border-bottom:none}
    .meal-ic{font-size:2rem;margin-right:12px;min-width:40px;text-align:center}
    .meal-info{flex:1}
    .meal-nm{font-weight:600;font-size:0.95rem}
    .meal-cal{font-size:0.82rem;color:var(--muted);margin-top:2px}
    .meal-btn{width:36px;height:36px;border-radius:50%;background:var(--green-lt);border:none;font-size:1.4rem;color:var(--green-dk);cursor:pointer;display:flex;align-items:center;justify-content:center}
    .glasses{display:flex;gap:8px;flex-wrap:wrap}
    .glass{width:38px;height:38px;border-radius:8px;border:2px solid var(--green);cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;transition:background 0.2s;background:transparent}
    .glass.ok{background:var(--green)}
    .sem{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;font-weight:600;font-size:0.95rem}
    .sem.v{background:#D4EDDA;color:#155724}
    .sem.a{background:#FFF3CD;color:#856404}
    .sem.r{background:#F8D7DA;color:#721C24}
    .upload-area{border:2px dashed var(--green);border-radius:16px;padding:24px 16px;text-align:center;cursor:pointer;transition:background 0.2s}
    .upload-area:hover{background:var(--green-lt)}
    .upload-area input{display:none}
    .preview-img{width:100%;max-height:240px;object-fit:cover;border-radius:12px}
    .wlc-hero{background:linear-gradient(160deg,#1AB87C,#0D9E67);padding:48px 24px 56px;text-align:center;color:#fff}
    .wlc-emoji{font-size:4.5rem;margin-bottom:12px}
    .wlc-title{font-size:2.1rem;font-weight:800;margin-bottom:8px}
    .wlc-sub{font-size:1rem;opacity:0.9;line-height:1.5}
    .feat-item{display:flex;align-items:center;gap:14px;padding:14px;background:#fff;border-radius:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
    .feat-ic{font-size:2rem}
    .feat-txt-title{font-weight:600;font-size:0.95rem}
    .feat-txt-desc{font-size:0.82rem;color:var(--muted);margin-top:2px}
    .trial-badge{background:var(--yellow);color:#7D5A00;padding:10px 24px;border-radius:100px;font-weight:700;font-size:0.9rem;display:inline-block;margin-bottom:20px}
    .loading{text-align:center;padding:40px 20px}
    .spinner{width:48px;height:48px;border:4px solid var(--green-lt);border-top:4px solid var(--green);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .pw-hero{background:linear-gradient(160deg,#1AB87C,#0D9E67);padding:40px 24px;text-align:center;color:#fff}
    .pw-price{font-size:2.8rem;font-weight:800}
    .pw-feat{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
    .pw-feat:last-child{border-bottom:none}
    .peso-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
    .peso-item:last-child{border-bottom:none}
    .bmi-bar{height:12px;border-radius:6px;background:linear-gradient(to right,#74b9ff,#55efc4,#fdcb6e,#e17055,#d63031);position:relative;margin:10px 0 20px}
    .bmi-dot{width:16px;height:16px;background:#2D3436;border:3px solid #fff;border-radius:50%;position:absolute;top:-2px;transform:translateX(-50%);box-shadow:0 2px 6px rgba(0,0,0,0.3)}
    .dots{display:flex;justify-content:center;gap:8px;padding:16px 0 0}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all 0.3s}
    .dot.on{background:var(--green);width:24px;border-radius:4px}
    .nut-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
    .nut-cell{background:var(--green-lt);border-radius:10px;padding:12px;text-align:center}
    .nut-val{font-size:1.3rem;font-weight:800;color:var(--green-dk)}
    .nut-lbl{font-size:0.75rem;color:var(--muted);margin-top:2px}
    .food-tag{display:inline-block;background:#F1F3F5;border-radius:100px;padding:4px 12px;font-size:0.82rem;margin:3px;color:var(--text)}
    .mot-card{background:linear-gradient(135deg,#f6d365,#fda085);color:#fff;border-radius:16px;padding:20px;margin:12px 16px;text-align:center}
    .mot-card p{font-size:1rem;font-weight:600;line-height:1.5}
    .back-btn{background:transparent;border:none;color:#fff;font-size:1.5rem;cursor:pointer;padding:0;margin-right:8px}
    .fade{animation:fadeIn 0.3s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .tip{font-size:0.82rem;color:var(--muted);margin-top:6px}
    .bold{font-weight:700}
    .green{color:var(--green-dk)}
    .mt8{margin-top:8px}
    .mt16{margin-top:16px}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:flex-end;z-index:200}
    .sheet{background:#fff;border-radius:24px 24px 0 0;padding:28px 24px;width:100%;max-width:430px;margin:0 auto;animation:slideUp 0.3s ease}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const CHECKOUT_URL = "https://homefitai.lemonsqueezy.com/checkout/buy/5cf46551-5070-47fd-aeef-7317ae8f068d";
const FOURLIFE_URL = "https://www.4life.com/7912430";
const TRIAL_DAYS   = 7;
const SK = {
  perfil:  "nc_perfil",
  habitos: "nc_habitos",
  log:     "nc_foodlog",
  pesos:   "nc_pesos",
  agua:    "nc_agua",
  fecha:   "nc_signup",
  premium: "nc_premium",
};
const MOTIVATIONS = [
  "Cada comida saludable es un paso hacia tu mejor versión. 💪",
  "No se trata de ser perfecto, se trata de ser constante. 🌱",
  "Tu cuerpo merece lo mejor. Aliméntalo con amor. 💚",
  "Pequeños cambios hoy, grandes resultados mañana. ✨",
  "La salud es la mayor riqueza que puedes tener. 🌟",
  "Cada vaso de agua es un acto de amor hacia ti mismo. 💧",
];
const save  = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const load  = (k)    => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const today = ()     => new Date().toISOString().slice(0, 10);
const fmt   = (n)    => (n || 0).toFixed(0);
function calcBMR(p) {
  const base = 10 * p.peso + 6.25 * p.estatura - 5 * p.edad;
  return p.genero === "hombre" ? Math.round(base + 5) : Math.round(base - 161);
}
const ACT = { sedentario: 1.2, ligero: 1.375, moderado: 1.55, activo: 1.725, muy_activo: 1.9 };
function calcMetas(p) {
  const bmr  = calcBMR(p);
  const tdee = Math.round(bmr * (ACT[p.actividad] || 1.375));
  let cal    = tdee;
  if (p.objetivo === "bajar") cal = Math.max(1200, tdee - 500);
  if (p.objetivo === "ganar") cal = tdee + 300;
  return {
    calorias:      cal,
    proteinas:     Math.round((cal * 0.30) / 4),
    carbohidratos: Math.round((cal * 0.40) / 4),
    grasas:        Math.round((cal * 0.30) / 9),
    agua:          Math.round(p.peso * 0.033),
  };
}
function calcBMI(p) { const h = p.estatura / 100; return +(p.peso / (h * h)).toFixed(1); }
function bmiLabel(bmi) {
  if (bmi < 18.5) return { label: "Bajo peso", color: "#74b9ff" };
  if (bmi < 25)   return { label: "Normal", color: "#00b894" };
  if (bmi < 30)   return { label: "Sobrepeso", color: "#fdcb6e" };
  return { label: "Obesidad", color: "#e17055" };
}
function bmiPos(bmi) { return ((Math.min(Math.max(bmi, 14), 40) - 14) / 26) * 100; }
function trialStatus() {
  if (load(SK.premium)) return "premium";
  const d = load(SK.fecha);
  if (!d) return "new";
  const days = Math.floor((Date.now() - d) / 86400000);
  return days < TRIAL_DAYS ? `trial:${TRIAL_DAYS - days}` : "expired";
}
function todayLog() {
  const all = load(SK.log) || {};
  return all[today()] || { desayuno: null, almuerzo: null, cena: null, snack: null };
}
function saveMeal(mealType, data) {
  const all = load(SK.log) || {};
  if (!all[today()]) all[today()] = { desayuno: null, almuerzo: null, cena: null, snack: null };
  all[today()][mealType] = data;
  save(SK.log, all);
}
function todayTotals() {
  const log = todayLog();
  const meals = Object.values(log).filter(Boolean);
  return meals.reduce(
    (acc, m) => ({
      calorias:      acc.calorias      + (m.calorias_total || 0),
      proteinas:     acc.proteinas     + (m.proteinas_g    || 0),
      carbohidratos: acc.carbohidratos + (m.carbohidratos_g|| 0),
      grasas:        acc.grasas        + (m.grasas_g       || 0),
    }),
    { calorias: 0, proteinas: 0, carbohidratos: 0, grasas: 0 }
  );
}
function CalRing({ consumed, target }) {
  const r = 70, circ = 2 * Math.PI * r;
  const pct = Math.min(consumed / (target || 1), 1);
  const color = pct > 1 ? "#FF7675" : pct > 0.85 ? "#FDCB6E" : "#1AB87C";
  return (
    <div className="ring-wrap">
      <svg width="160" height="160" style={{display:"block"}}>
        <circle cx="80" cy="80" r={r} fill="none" stroke="#DFE6E9" strokeWidth="12" />
        <circle cx="80" cy="80" r={r} fill="none" stroke={color} strokeWidth="12"
          strokeDasharray={circ} strokeDashoffset={circ * (1 - pct)} strokeLinecap="round"
          style={{ transform: "rotate(-90deg)", transformOrigin: "80px 80px", transition: "stroke-dashoffset 0.6s ease" }} />
      </svg>
      <div className="ring-inner" style={{position:"absolute",top:"50%",transform:"translateY(-50%)"}}>
        <div className="ring-cal">{fmt(consumed)}</div>
        <div className="ring-lbl">de {fmt(target)} kcal</div>
      </div>
    </div>
  );
}
function MacroBar({ label, consumed, target, color }) {
  const pct = Math.min((consumed / (target || 1)) * 100, 100);
  return (
    <div className="mb">
      <div className="mb-hd"><span>{label}</span><span>{fmt(consumed)} / {fmt(target)} g</span></div>
      <div className="mb-track"><div className="mb-fill" style={{ width: pct + "%", background: color }} /></div>
    </div>
  );
}
function Welcome({ onStart }) {
  return (
    <div className="fade">
      <div className="wlc-hero">
        <div className="wlc-emoji">🥗</div>
        <div className="wlc-title">NutriCoach AI</div>
        <div className="wlc-sub">Tu coach de nutrición personalizado con inteligencia artificial</div>
      </div>
      <div style={{ padding: "24px 16px 0" }}>
        <div style={{ textAlign: "center", marginBottom: "20px" }}>
          <div className="trial-badge">✨ 7 días gratis, luego $8.99/mes</div>
        </div>
        {[
          { ic: "📸", t: "Analiza tus comidas con IA", d: "Sube una foto de tu plato y obtén el desglose nutricional completo" },
          { ic: "🎯", t: "Metas personalizadas", d: "Calculamos tus calorías y macros exactos según tu cuerpo y objetivo" },
          { ic: "📊", t: "Seguimiento de progreso", d: "Registra tu peso y ve cómo avanzas semana a semana" },
          { ic: "💧", t: "Hidratación y hábitos", d: "Recuerda tomar agua y mantén tus hábitos saludables" },
          { ic: "🍽️", t: "Plan semanal personalizado", d: "Recibe sugerencias de comidas basadas en lo que ya comes" },
        ].map((f, i) => (
          <div key={i} className="feat-item">
            <div className="feat-ic">{f.ic}</div>
            <div><div className="feat-txt-title">{f.t}</div><div className="feat-txt-desc">{f.d}</div></div>
          </div>
        ))}
        <div style={{ padding: "20px 0" }}>
          <button className="btn btn-p" onClick={onStart}>Comenzar gratis 🚀</button>
          <p style={{ textAlign: "center", fontSize: "0.78rem", color: "var(--muted)", marginTop: "10px" }}>Sin tarjeta de crédito para la prueba gratuita</p>
        </div>
      </div>
    </div>
  );
}
function FormPerfil({ onNext, initial }) {
  const [f, setF] = useState(initial || { nombre: "", edad: "", genero: "mujer", peso: "", estatura: "", actividad: "moderado", objetivo: "bajar" });
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const ok  = f.nombre && f.edad && f.peso && f.estatura;
  return (
    <div className="fade">
      <div className="hdr">
        <div className="hdr-logo">🥗 NutriCoach AI</div>
        <div style={{ fontSize: "0.85rem", opacity: 0.85, marginTop: 2 }}>Paso 1 de 2 · Tu perfil</div>
      </div>
      <div style={{ padding: "0 16px 24px" }}>
        <div className="dots" style={{ marginBottom: 8 }}><div className="dot on" /><div className="dot" /></div>
        <div className="card">
          <div className="card-title">Cuéntanos sobre ti</div>
          <div className="fg"><label className="fl">Tu nombre</label><input className="fi" placeholder="Ej: María" value={f.nombre} onChange={e => set("nombre", e.target.value)} /></div>
          <div className="fg"><label className="fl">Edad</label><input className="fi" type="number" placeholder="Años" min="18" max="100" value={f.edad} onChange={e => set("edad", e.target.value)} /></div>
          <div className="fg"><label className="fl">Género</label><div className="radio-group">{[["mujer","👩 Mujer"],["hombre","👨 Hombre"]].map(([v,l]) => (<div key={v} className={`radio-opt${f.genero===v?" sel":""}`} onClick={() => set("genero", v)}>{l}</div>))}</div></div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "12px" }}>
            <div className="fg"><label className="fl">Peso actual (kg)</label><input className="fi" type="number" placeholder="70" value={f.peso} onChange={e => set("peso", e.target.value)} /></div>
            <div className="fg"><label className="fl">Estatura (cm)</label><input className="fi" type="number" placeholder="165" value={f.estatura} onChange={e => set("estatura", e.target.value)} /></div>
          </div>
          <div className="fg"><label className="fl">Nivel de actividad</label><select className="fs" value={f.actividad} onChange={e => set("actividad", e.target.value)}><option value="sedentario">🛋️ Sedentario</option><option value="ligero">🚶 Ligero (1–3 días)</option><option value="moderado">🏃 Moderado (3–5 días)</option><option value="activo">🏋️ Activo (6–7 días)</option><option value="muy_activo">⚡ Muy activo</option></select></div>
          <div className="fg"><label className="fl">Tu objetivo principal</label><div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "8px" }}>{[["bajar","⬇️ Bajar peso"],["mantener","⚖️ Mantener"],["ganar","💪 Ganar músculo"]].map(([v,l]) => (<div key={v} className={`radio-opt${f.objetivo===v?" sel":""}`} onClick={() => set("objetivo", v)} style={{ fontSize: "0.82rem" }}>{l}</div>))}</div></div>
        </div>
        <button className="btn btn-p" disabled={!ok} onClick={() => onNext(f)} style={{ opacity: ok ? 1 : 0.5 }}>Siguiente →</button>
      </div>
    </div>
  );
}
function FormHabitos({ onNext, onBack, perfilNombre }) {
  const saved = load(SK.habitos) || {};
  const [f, setF] = useState({ desayuno: "", almuerzo: "", cena: "", restricciones: [], agua_habitual: "4", ...saved });
  const set  = (k, v) => setF(p => ({ ...p, [k]: v }));
  const togR = (r) => setF(p => ({ ...p, restricciones: p.restricciones.includes(r) ? p.restricciones.filter(x => x !== r) : [...p.restricciones, r] }));
  const RESTS = ["Vegetariano","Vegano","Sin gluten","Sin lactosa","Sin mariscos","Sin cerdo"];
  return (
    <div className="fade">
      <div className="hdr"><div className="hdr-logo">🥗 NutriCoach AI</div><div style={{ fontSize: "0.85rem", opacity: 0.85, marginTop: 2 }}>Paso 2 de 2 · Tus hábitos</div></div>
      <div style={{ padding: "0 16px 24px" }}>
        <div className="dots" style={{ marginBottom: 8 }}><div className="dot" /><div className="dot on" /></div>
        <div className="card">
          <div className="card-title">¿Qué sueles comer normalmente?</div>
          <p style={{ fontSize: "0.85rem", color: "var(--muted)", marginBottom: "16px" }}>Esto nos ayuda a sugerirte comidas adaptadas a lo que ya comes, {perfilNombre}.</p>
          <div className="fg"><label className="fl">☀️ Desayuno habitual</label><textarea className="fta" placeholder="Ej: Café con leche, pan, una fruta" value={f.desayuno} onChange={e => set("desayuno", e.target.value)} /></div>

function RegistrarComida({ mealType, perfil, onBack, onSave }) {
  const [img, setImg] = useState(null), [b64, setB64] = useState(null), [mime, setMime] = useState("image/jpeg");

    const file = e.target.files[0]; if (!file) return;

                <input ref={galleryRef} type="file" accept="image/*" onChange={handleFile} style={{ display: "none" }} />
              </div>
            ) : (

                <div style={{ display: "flex", gap: "10px", marginTop: "12px" }}>

      <div style={{ padding: "24px 16px" }}>
        <div className="card" style={{ textAlign: "center" }}><div style={{ fontSize: "0.88rem", color: "var(--muted)", marginBottom: "4px" }}>Suscripción mensual</div><div className="pw-price">$8.99</div><div style={{ fontSize: "0.9rem", color: "var(--muted)" }}>USD por mes · Cancela cuando quieras</div><button className="btn btn-p mt16" onClick={() => window.location.href = CHECKOUT_URL}>🚀 Obtener NutriCoach Premium</button></div>
        <div className="card"><div className="card-title">✨ Todo incluido en Premium</div>{[["📸","Análisis ilimitado de fotos con IA"],["🎯","Metas personalizadas de calorías y macros"],["📊","Seguimiento detallado de progreso"],["🗓️","Plan semanal de comidas"],["💧","Rastreador de hidratación"],["⚖️","Registro y gráfica de peso"]].map(([ic,t],i) => (<div key={i} className="pw-feat"><span style={{ fontSize: "1.4rem" }}>{ic}</span><span style={{ fontSize: "0.9rem" }}>{t}</span></div>))}</div>
      </div>
    </div>
  );
}
function App() {
  const [screen, setScreen] = useState(() => (!load(SK.fecha) || !load(SK.perfil)) ? "welcome" : "dashboard");
  const [perfil, setPerfil] = useState(() => load(SK.perfil));
  const [habitos, setHabitos] = useState(() => load(SK.habitos));
  const [nav, setNav] = useState("dashboard");
  const [mealType, setMeal] = useState(null);
  const [agua, setAgua] = useState(() => { const aq = load(SK.agua) || {}; return aq[today()] || 0; });
  const trial = trialStatus();
  const startOnboarding = () => { if (!load(SK.fecha)) save(SK.fecha, Date.now()); setScreen("perfil"); };
  const donePerfil = (p) => { const parsed = { ...p, edad: +p.edad, peso: +p.peso, estatura: +p.estatura }; setPerfil(parsed); save(SK.perfil, parsed); setScreen("habitos"); };
  const doneHabitos = (h) => { setHabitos(h); save(SK.habitos, h); setScreen("dashboard"); setNav("dashboard"); };
  const openMeal = (type) => { if (trial === "expired") { setScreen("paywall"); return; } setMeal(type); setScreen("meal"); };
  const navTo = (tab) => { if (trial === "expired" && tab !== "dashboard") { setScreen("paywall"); return; } setNav(tab); setScreen(tab); };
  const NAV = [{key:"dashboard",ic:"🏠",label:"Inicio"},{key:"plan",ic:"🗓️",label:"Plan"},{key:"progreso",ic:"📊",label:"Progreso"},{key:"perfil_edit",ic:"👤",label:"Perfil"}];
  if (screen === "welcome") return <Welcome onStart={startOnboarding} />;
  if (screen === "perfil")  return <FormPerfil onNext={donePerfil} initial={perfil} />;
  if (screen === "habitos") return <FormHabitos onNext={doneHabitos} onBack={() => setScreen("perfil")} perfilNombre={perfil?.nombre || ""} />;
  if (screen === "paywall") return <Paywall />;
  if (screen === "meal")    return <RegistrarComida mealType={mealType} perfil={perfil} onBack={() => { setScreen("dashboard"); setNav("dashboard"); }} onSave={() => { setScreen("dashboard"); setNav("dashboard"); }} />;
  return (
    <div className="app">
      {screen === "dashboard" && perfil && <Dashboard perfil={perfil} onMeal={openMeal} trialInfo={trial} agua={agua} setAgua={setAgua} />}
      {screen === "plan" && perfil && <PlanSemanal perfil={perfil} habitos={habitos} />}
      {screen === "progreso" && perfil && <Progreso perfil={perfil} />}
      {screen === "perfil_edit" && (
        <div className="content fade">
          <div className="hdr"><div className="hdr-logo">👤 Mi perfil</div></div>
          <div className="card"><div className="card-title">Tus datos</div>{perfil && Object.entries({"Nombre":perfil.nombre,"Edad":perfil.edad+" años","Género":perfil.genero,"Peso":perfil.peso+" kg","Estatura":perfil.estatura+" cm","Actividad":perfil.actividad,"Objetivo":perfil.objetivo}).map(([k,v]) => (<div key={k} style={{ display: "flex", justifyContent: "space-between", padding: "10px 0", borderBottom: "1px solid var(--border)", fontSize: "0.95rem" }}><span style={{ color: "var(--muted)" }}>{k}</span><span style={{ fontWeight: 600 }}>{v}</span></div>))}<button className="btn btn-s mt16" onClick={() => setScreen("perfil")}>✏️ Editar perfil</button></div>
          <div className="card"><button className="btn" style={{ background: "#FFE9E9", color: "var(--red)" }} onClick={() => { if (confirm("¿Reiniciar app? Se borrarán todos tus datos.")) { Object.values(SK).forEach(k => localStorage.removeItem(k)); window.location.reload(); } }}>🗑️ Reiniciar app</button></div>
        </div>
      )}
      <nav className="bnav">{NAV.map(n => (<button key={n.key} className={`bni${nav === n.key ? " on" : ""}`} onClick={() => navTo(n.key)}><span className="bni-ic">{n.ic}</span><span>{n.label}</span></button>))}</nav>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
