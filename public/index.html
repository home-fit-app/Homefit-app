<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HomeFit AI</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060e06;min-height:100vh;font-family:sans-serif;color:#e8f5e8}
input{width:100%;padding:14px 18px;border-radius:12px;border:1.5px solid #2a3a2a;background:#0e1a0e;color:#e8f5e8;font-size:15px;outline:none}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState}=React;
const niveles=["Principiante absoluto","Algo de base","Intermedio"];
const objetivos=["Perder peso","Ganar músculo","Mejorar resistencia","Más energía"];
const tiempos=["15 min","30 min","45 min","60 min"];
const diasOpc=["2 días","3 días","4 días","5 días"];

function Tag({label,selected,onClick}){
return <button onClick={onClick} style={{padding:"10px 18px",borderRadius:"100px",border:⁠ 1.5px solid ${selected?"#22c55e":"#2a3a2a"} ⁠,background:selected?"rgba(34,197,94,0.1)":"transparent",color:selected?"#22c55e":"#6b7f6b",cursor:"pointer",fontSize:"14px",margin:"4px",fontFamily:"sans-serif"}}>{label}</button>
}

function App(){
const[step,setStep]=useState("perfil");
const[form,setForm]=useState({nivel:"",objetivo:"",tiempo:"",dias:"",nombre:""});
const[plan,setPlan]=useState("");
const toggle=(key,val)=>setForm(f=>({...f,[key]:f[key]===val?"":val}));
const completo=form.nivel&&form.objetivo&&form.tiempo&&form.dias;

const generar=async()=>{
setStep("generando");
try{
const res=await fetch("https://api.anthropic.com/v1/messages",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
model:"claude-sonnet-4-20250514",
max_tokens:1000,
messages:[{role:"user",content:⁠ Eres entrenador personal experto. Crea plan semanal en casa sin equipo para: Nivel: ${form.nivel}, Objetivo: ${form.objetivo}, Tiempo por sesión: ${form.tiempo}, Días: ${form.dias}. Organiza por días con ejercicios específicos, series y repeticiones. ⁠}]
})
});
const data=await res.json();
setPlan(data.content?.[0]?.text||"Error generando plan.");
}catch(e){setPlan("Error de conexión. Intenta de nuevo.");}
setStep("plan");
};

if(step==="generando")return(
<div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"20px"}}>
<div style={{width:"60px",height:"60px",borderRadius:"50%",border:"2px solid #22c55e",borderTopColor:"transparent",animation:"spin 0.8s linear infinite"}}/>
<style>{⁠ @keyframes spin{to{transform:rotate(360deg)}} ⁠}</style>
<p style={{color:"#22c55e",fontFamily:"monospace"}}>Generando tu plan...</p>
</div>
);

if(step==="plan")return(
<div style={{maxWidth:"600px",margin:"0 auto",padding:"40px 20px"}}>
<h2 style={{fontSize:"24px",marginBottom:"8px"}}>{form.nombre?⁠ Plan de ${form.nombre} ⁠:"Tu plan personalizado"}</h2>
<p style={{color:"#6b7f6b",marginBottom:"24px"}}>{form.objetivo} · {form.tiempo} · {form.dias}</p>
<div style={{background:"#0e1a0e",border:"1px solid #2a3a2a",borderRadius:"16px",padding:"24px",color:"#c8e6c8",fontSize:"14px",lineHeight:"1.8",whiteSpace:"pre-wrap",marginBottom:"24px"}}>{plan}</div>
<div style={{background:"rgba(34,197,94,0.08)",border:"1px solid rgba(34,197,94,0.2)",borderRadius:"16px",padding:"24px",textAlign:"center",marginBottom:"16px"}}>
<h3 style={{marginBottom:"8px"}}>🔒 Plan de prueba gratis</h3>
<p style={{color:"#6b7f6b",fontSize:"13px",marginBottom:"16px"}}>Suscríbete para nuevos planes cada semana y seguimiento de progreso</p>
<button style={{background:"linear-gradient(135deg,#16a34a,#22c55e)",color:"#fff",border:"none",borderRadius:"10px",padding:"14px 32px",fontSize:"15px",fontWeight:"600",cursor:"pointer",width:"100%"}}>Suscribirme por $9/mes →</button>
</div>
<button onClick={()=>setStep("perfil")} style={{width:"100%",padding:"14px",background:"transparent",border:"1px solid #2a3a2a",borderRadius:"10px",color:"#3a5a3a",cursor:"pointer",fontSize:"14px"}}>← Crear otro plan</button>
</div>
);

return(
<div style={{maxWidth:"560px",margin:"0 auto",padding:"40px 20px"}}>
<div style={{textAlign:"center",marginBottom:"40px"}}>
<h1 style={{fontSize:"36px",marginBottom:"12px"}}>Tu plan de entreno,<br/><span style={{color:"#22c55e"}}>sin salir de casa</span></h1>
<p style={{color:"#6b7f6b"}}>Responde 4 preguntas y la IA crea tu plan</p>
</div>
<div style={{display:"flex",flexDirection:"column",gap:"28px"}}>
<div>
<label style={{display:"block",color:"#a0b8a0",fontSize:"12px",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"12px"}}>¿Cómo te llamas? (opcional)</label>
<input value={form.nombre} onChange={e=>setForm(f=>({...f,nombre:e.target.value}))} placeholder="Tu nombre..."/>
</div>
{[{key:"nivel",label:"Nivel de condición física",opts:niveles},{key:"objetivo",label:"¿Cuál es tu objetivo?",opts:objetivos},{key:"tiempo",label:"Tiempo por sesión",opts:tiempos},{key:"dias",label:"Días a la semana",opts:diasOpc}].map(({key,label,opts})=>(
<div key={key}>
<label style={{display:"block",color:"#a0b8a0",fontSize:"12px",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"12px"}}>{label}</label>
<div style={{display:"flex",flexWrap:"wrap"}}>{opts.map(o=><Tag key={o} label={o} selected={form[key]===o} onClick={()=>toggle(key,o)}/>)}</div>
</div>
))}
<button onClick={()=>completo&&generar()} style={{width:"100%",padding:"18px",borderRadius:"14px",border:"none",background:completo?"linear-gradient(135deg,#16a34a,#22c55e)":"#1a2a1a",color:completo?"#fff":"#3a4f3a",fontSize:"16px",fontWeight:"600",cursor:completo?"pointer":"not-allowed"}}>
{completo?"✦ Generar mi plan con IA":"Completa las opciones para continuar"}
</button>
</div>
</div>
);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
